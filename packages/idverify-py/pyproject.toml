[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idverify"
version = "0.1.0"
description = "ID verification library — OCR, MRZ parsing, screenshot detection, and age gate for government IDs"
readme = "README.md"
authors = [
    {name = "Maou", email = "daddymaouu@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["id", "verification", "mrz", "ocr", "passport", "drivers-license", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "mrz>=0.2.0",
    "exifread>=3.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/daddymaou/idverify"
Repository = "https://github.com/daddymaou/idverify"
Documentation = "https://github.com/daddymaou/idverify#readme"
Issues = "https://github.com/daddymaou/idverify/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["idverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true